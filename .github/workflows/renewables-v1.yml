name: Renewables V1 and V2
on:
  pull_request:
    paths: ['projects/renewables-electricity-trading/**', '.github/workflows/renewables-v1.yml']
  push:
    branches: [main, codex/renewables-v2-aws]
    paths: ['projects/renewables-electricity-trading/**', '.github/workflows/renewables-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: renewables-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Verify ${{ matrix.version }}
    strategy:
      fail-fast: false
      matrix:
        version: [v1, v2]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: projects/renewables-electricity-trading/${{ matrix.version }}
    env:
      CONFIG_FILE: ${{ matrix.version == 'v2' && 'v2.env' || '.env.example' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.5'
          python-version: '3.11'
          enable-cache: true
      - name: Initialize V2 configuration
        if: matrix.version == 'v2'
        run: cp v2.env.example v2.env
      - name: Lint and contracts
        run: make lint
      - name: Build and start Compose
        run: make up
      - name: PostgreSQL tests
        run: make test
      - name: End-to-end and worker recovery
        run: |
          make e2e
          make broker-test
      - name: Restore rehearsal
        run: |
          docker compose --env-file "$CONFIG_FILE" stop trading-worker market-data-worker valuation-worker
          uv run --project services/trading python tools/recovery_check.py
      - name: Diagnostics
        if: failure()
        run: docker compose --env-file "$CONFIG_FILE" logs --no-color --tail 100
      - name: Stop containers
        if: always()
        run: docker compose --env-file "$CONFIG_FILE" -f compose.yaml -f compose.test.yaml down --volumes --remove-orphans
