include classpath("application.conf")
node-address { protocol = http, host = "elasticmq", port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }
rest-stats { enabled = false }
queues {
 trading-dlq { defaultVisibilityTimeout = 30 seconds, receiveMessageWait = 0 seconds }
 valuation-dlq { defaultVisibilityTimeout = 30 seconds, receiveMessageWait = 0 seconds }
 trading-input { defaultVisibilityTimeout = 30 seconds, receiveMessageWait = 2 seconds, deadLettersQueue { name = "trading-dlq", maxReceiveCount = 3 } }
 valuation-input { defaultVisibilityTimeout = 30 seconds, receiveMessageWait = 2 seconds, deadLettersQueue { name = "valuation-dlq", maxReceiveCount = 3 } }
}
