receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:COLLECTOR_LIMIT_MIB}
    spike_limit_mib: ${env:COLLECTOR_SPIKE_MIB}
  batch:
    send_batch_size: ${env:COLLECTOR_BATCH_SIZE}
    timeout: ${env:COLLECTOR_BATCH_TIMEOUT}
exporters:
  debug:
    verbosity: detailed
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
