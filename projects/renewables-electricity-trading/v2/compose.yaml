name: ${COMPOSE_PROJECT_NAME:?Load v2.env}
x-env: &env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Load v2.env}
  DB_HOST: ${DB_HOST}
  DB_NAME: ${DB_NAME}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
  OTEL_ENABLED: ${OTEL_ENABLED}
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
  SQS_ENDPOINT_URL: ${SQS_ENDPOINT_URL}
  TRADER_TOKEN: ${TRADER_TOKEN:?Set local tokens}
  RISK_TOKEN: ${RISK_TOKEN:?Set local tokens}
  VIEWER_TOKEN: ${VIEWER_TOKEN:?Set local tokens}
x-process: &process
  env_file: ${V2_ENV_FILE:-v2.env}
  restart: unless-stopped
  init: true
  stop_grace_period: ${STOP_GRACE_PERIOD}
  mem_limit: ${PROCESS_MEMORY}
  cpus: ${PROCESS_CPUS}
  logging:
    driver: json-file
    options: {max-size: "${DOCKER_LOG_MAX_SIZE}", max-file: "${DOCKER_LOG_MAX_FILES}"}
x-api: &api
  <<: *process
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
    interval: ${API_HEALTH_INTERVAL}
    timeout: ${API_HEALTH_TIMEOUT}
    retries: ${API_HEALTH_RETRIES}
services:
  postgres:
    env_file: ${V2_ENV_FILE:-v2.env}
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
      TRADING_DB_PASSWORD: ${TRADING_DB_PASSWORD:?Set database password}
      MARKET_DATA_DB_PASSWORD: ${MARKET_DATA_DB_PASSWORD:?Set database password}
      VALUATION_DB_PASSWORD: ${VALUATION_DB_PASSWORD:?Set database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/local/init-db.sql:/docker-entrypoint-initdb.d/10-services.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d $$POSTGRES_DB"]
      interval: ${POSTGRES_HEALTH_INTERVAL}
      timeout: ${POSTGRES_HEALTH_TIMEOUT}
      retries: ${POSTGRES_HEALTH_RETRIES}
    mem_limit: ${POSTGRES_MEMORY}
    cpus: ${POSTGRES_CPUS}
  elasticmq:
    image: ${ELASTICMQ_IMAGE}
    volumes: ["./deploy/local/elasticmq.conf:/opt/elasticmq.conf:ro"]
    mem_limit: ${ELASTICMQ_MEMORY}
    cpus: ${ELASTICMQ_CPUS}
  trading-init:
    env_file: ${V2_ENV_FILE:-v2.env}
    build: ./services/trading
    environment: &trading-env
      <<: *env
      DB_USER: ${TRADING_DB_USER}
      DB_PASSWORD: ${TRADING_DB_PASSWORD}
      CONSUMER_QUEUE: ${TRADING_QUEUE}
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed"]
    depends_on: {postgres: {condition: service_healthy}}
  market-data-init:
    env_file: ${V2_ENV_FILE:-v2.env}
    build: ./services/market-data
    environment: &market-env
      <<: *env
      DB_USER: ${MARKET_DATA_DB_USER}
      DB_PASSWORD: ${MARKET_DATA_DB_PASSWORD}
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed"]
    depends_on: {postgres: {condition: service_healthy}}
  valuation-init:
    env_file: ${V2_ENV_FILE:-v2.env}
    build: ./services/valuation
    environment: &valuation-env
      <<: *env
      DB_USER: ${VALUATION_DB_USER}
      DB_PASSWORD: ${VALUATION_DB_PASSWORD}
      CONSUMER_QUEUE: ${VALUATION_QUEUE}
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py seed"]
    depends_on: {postgres: {condition: service_healthy}}
  trading:
    <<: *api
    build: ./services/trading
    environment: *trading-env
    ports: ["${BIND_ADDRESS}:${TRADING_PORT}:8000"]
    depends_on: {trading-init: {condition: service_completed_successfully}}
  trading-worker:
    <<: *process
    build: ./services/trading
    environment: *trading-env
    command: [python, manage.py, worker]
    depends_on:
      trading-init: {condition: service_completed_successfully}
      elasticmq: {condition: service_started}
  market-data:
    volumes: ["./fixtures:/fixtures:ro"]
    <<: *api
    build: ./services/market-data
    environment: *market-env
    ports: ["${BIND_ADDRESS}:${MARKET_DATA_PORT}:8000"]
    depends_on: {market-data-init: {condition: service_completed_successfully}}
  market-data-worker:
    <<: *process
    build: ./services/market-data
    environment: *market-env
    command: [python, manage.py, worker]
    depends_on:
      market-data-init: {condition: service_completed_successfully}
      elasticmq: {condition: service_started}
  valuation:
    <<: *api
    build: ./services/valuation
    environment: *valuation-env
    ports: ["${BIND_ADDRESS}:${VALUATION_PORT}:8000"]
    depends_on: {valuation-init: {condition: service_completed_successfully}}
  valuation-worker:
    <<: *process
    build: ./services/valuation
    environment: *valuation-env
    command: [python, manage.py, worker]
    depends_on:
      valuation-init: {condition: service_completed_successfully}
      elasticmq: {condition: service_started}
  scheduler:
    <<: *process
    build: ./services/market-data
    profiles: [live]
    environment: *market-env
    command: [python, manage.py, schedule]
    depends_on: {market-data-init: {condition: service_completed_successfully}}
  otel-collector:
    env_file: ${V2_ENV_FILE:-v2.env}
    image: ${OTEL_COLLECTOR_IMAGE}
    profiles: [observability]
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./deploy/local/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    mem_limit: ${COLLECTOR_MEMORY}
    logging:
      driver: json-file
      options: {max-size: "${DOCKER_LOG_MAX_SIZE}", max-file: "${DOCKER_LOG_MAX_FILES}"}
  simulator:
    env_file: ${V2_ENV_FILE:-v2.env}
    build: ./services/trading
    profiles: [tools]
    environment:
      TRADER_TOKEN: ${TRADER_TOKEN}
    volumes: ["./tools:/tools:ro"]
    command: [python, /tools/simulator.py, --url, "${SIMULATOR_URL}", --requests, "${SIMULATOR_REQUESTS}", --rate, "${SIMULATOR_RATE}"]
    depends_on: {trading: {condition: service_healthy}}
volumes:
  postgres-data:
