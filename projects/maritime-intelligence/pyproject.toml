[project]
name = "maritime-intelligence"
version = "0.1.0"
description = "Real AIS observations, vessel history and explainable port visits"
requires-python = ">=3.12,<3.14"
dependencies = [
  "boto3>=1.35,<2", "confluent-kafka>=2.6,<3", "fastapi>=0.115,<1",
  "paho-mqtt>=2.1,<3", "python-dotenv>=1.0,<2", "psycopg[binary]>=3.2,<4", "uvicorn>=0.34,<1",
  "opentelemetry-sdk>=1.30,<2", "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
  "opentelemetry-sdk-extension-aws>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]
deploy = ["botocore[crt]>=1.35,<2"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/v1", "src/v2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL, Kafka and S3 endpoints"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
