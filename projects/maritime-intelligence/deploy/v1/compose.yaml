x-app: &app
  image: ${APP_IMAGE:?set APP_IMAGE}
  restart: unless-stopped
  init: true
  env_file: ../../.env
  environment:
    AIS_BBOX: ${AIS_BBOX:?set AIS_BBOX}
    AIS_MQTT_HOST: ${AIS_MQTT_HOST:?set AIS_MQTT_HOST}
    AIS_MQTT_KEEPALIVE_SECONDS: ${AIS_MQTT_KEEPALIVE_SECONDS:?set AIS_MQTT_KEEPALIVE_SECONDS}
    AIS_MQTT_PATH: ${AIS_MQTT_PATH:?set AIS_MQTT_PATH}
    AIS_MQTT_PORT: ${AIS_MQTT_PORT:?set AIS_MQTT_PORT}
    AIS_MQTT_RECONNECT_MAX_SECONDS: ${AIS_MQTT_RECONNECT_MAX_SECONDS:?set AIS_MQTT_RECONNECT_MAX_SECONDS}
    AIS_MQTT_RECONNECT_MIN_SECONDS: ${AIS_MQTT_RECONNECT_MIN_SECONDS:?set AIS_MQTT_RECONNECT_MIN_SECONDS}
    AIS_MQTT_TOPIC: ${AIS_MQTT_TOPIC:?set AIS_MQTT_TOPIC}
    API_HISTORY_HOURS: ${API_HISTORY_HOURS:?set API_HISTORY_HOURS}
    API_HOST: ${API_HOST:?set API_HOST}
    API_MAX_PAGE_SIZE: ${API_MAX_PAGE_SIZE:?set API_MAX_PAGE_SIZE}
    API_PAGE_SIZE: ${API_PAGE_SIZE:?set API_PAGE_SIZE}
    API_PORT: ${API_PORT:?set API_PORT}
    API_TOKEN: ${API_TOKEN:?set API_TOKEN}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?set AWS_DEFAULT_REGION}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY-}
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:?set DB_CONNECT_TIMEOUT_SECONDS}
    DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:?set DB_STATEMENT_TIMEOUT_MS}
    DIGITRAFFIC_USER: ${DIGITRAFFIC_USER:?set DIGITRAFFIC_USER}
    EXPIRED_SECONDS: ${EXPIRED_SECONDS:?set EXPIRED_SECONDS}
    FRESH_SECONDS: ${FRESH_SECONDS:?set FRESH_SECONDS}
    HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:?set HTTP_TIMEOUT_SECONDS}
    KAFKA_CONSUMER_GROUP: ${KAFKA_CONSUMER_GROUP:?set KAFKA_CONSUMER_GROUP}
    KAFKA_DELIVERY_TIMEOUT_MS: ${KAFKA_DELIVERY_TIMEOUT_MS:?set KAFKA_DELIVERY_TIMEOUT_MS}
    KAFKA_POLL_SECONDS: ${KAFKA_POLL_SECONDS:?set KAFKA_POLL_SECONDS}
    KAFKA_QUEUE_MAX_MESSAGES: ${KAFKA_QUEUE_MAX_MESSAGES:?set KAFKA_QUEUE_MAX_MESSAGES}
    KAFKA_SERVERS: ${KAFKA_SERVERS:?set KAFKA_SERVERS}
    KAFKA_TOPIC: ${KAFKA_TOPIC:?set KAFKA_TOPIC}
    LOG_LEVEL: ${LOG_LEVEL:?set LOG_LEVEL}
    MIGRATIONS_DIR: ${MIGRATIONS_DIR:?set MIGRATIONS_DIR}
    POSITION_RETENTION_DAYS: ${POSITION_RETENTION_DAYS:?set POSITION_RETENTION_DAYS}
    REFERENCE_API_URL: ${REFERENCE_API_URL:?set REFERENCE_API_URL}
    REFERENCE_INTERVAL_SECONDS: ${REFERENCE_INTERVAL_SECONDS:?set REFERENCE_INTERVAL_SECONDS}
    REFERENCE_MAX_BYTES: ${REFERENCE_MAX_BYTES:?set REFERENCE_MAX_BYTES}
    S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    S3_ENDPOINT_URL: ${S3_ENDPOINT_URL?set S3_ENDPOINT_URL (empty for AWS)}
    S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:?set S3_MAX_ATTEMPTS}
    S3_PATH_STYLE: ${S3_PATH_STYLE:?set S3_PATH_STYLE}
    VISIT_ARRIVAL_OBSERVATIONS: ${VISIT_ARRIVAL_OBSERVATIONS:?set VISIT_ARRIVAL_OBSERVATIONS}
    VISIT_ARRIVAL_SECONDS: ${VISIT_ARRIVAL_SECONDS:?set VISIT_ARRIVAL_SECONDS}
    VISIT_DEPARTURE_OBSERVATIONS: ${VISIT_DEPARTURE_OBSERVATIONS:?set VISIT_DEPARTURE_OBSERVATIONS}
    VISIT_DEPARTURE_SECONDS: ${VISIT_DEPARTURE_SECONDS:?set VISIT_DEPARTURE_SECONDS}
    VISIT_EXIT_BUFFER_METRES: ${VISIT_EXIT_BUFFER_METRES:?set VISIT_EXIT_BUFFER_METRES}
    VISIT_GAP_SECONDS: ${VISIT_GAP_SECONDS:?set VISIT_GAP_SECONDS}
  depends_on:
    migrate:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - postgres:/home/postgres/pgdata/data
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:?set POSTGRES_SHARED_BUFFERS}", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:?set POSTGRES_MAX_CONNECTIONS}"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: ${POSTGRES_HEALTH_INTERVAL:?set POSTGRES_HEALTH_INTERVAL}
      timeout: ${POSTGRES_HEALTH_TIMEOUT:?set POSTGRES_HEALTH_TIMEOUT}
      retries: ${POSTGRES_HEALTH_RETRIES:?set POSTGRES_HEALTH_RETRIES}
    restart: unless-stopped
  kafka:
    image: ${KAFKA_IMAGE:?set KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID:?set KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: ${KAFKA_PROCESS_ROLES:?set KAFKA_PROCESS_ROLES}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS:?set KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS:?set KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:?set KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS:?set KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_CONTROLLER_LISTENER_NAMES: ${KAFKA_CONTROLLER_LISTENER_NAMES:?set KAFKA_CONTROLLER_LISTENER_NAMES}
      KAFKA_INTER_BROKER_LISTENER_NAME: ${KAFKA_INTER_BROKER_LISTENER_NAME:?set KAFKA_INTER_BROKER_LISTENER_NAME}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:?set KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:?set KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: ${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:?set KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS_ENABLE:?set KAFKA_AUTO_CREATE_TOPICS_ENABLE}
      KAFKA_LOG_DIRS: ${KAFKA_LOG_DIRS:?set KAFKA_LOG_DIRS}
      KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:?set KAFKA_LOG_RETENTION_HOURS}
      KAFKA_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:?set KAFKA_LOG_RETENTION_BYTES}
      KAFKA_LOG_SEGMENT_BYTES: ${KAFKA_LOG_SEGMENT_BYTES:?set KAFKA_LOG_SEGMENT_BYTES}
      KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS:?set KAFKA_HEAP_OPTS}
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?set KAFKA_CLUSTER_ID}
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server $${KAFKA_ADVERTISED_LISTENERS#*://} --list"]
      interval: ${KAFKA_HEALTH_INTERVAL:?set KAFKA_HEALTH_INTERVAL}
      timeout: ${KAFKA_HEALTH_TIMEOUT:?set KAFKA_HEALTH_TIMEOUT}
      retries: ${KAFKA_HEALTH_RETRIES:?set KAFKA_HEALTH_RETRIES}
    restart: unless-stopped
  kafka-init:
    image: ${KAFKA_IMAGE:?set KAFKA_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /opt/kafka/bin/kafka-topics.sh
    command: ["--bootstrap-server", "${KAFKA_SERVERS:?set KAFKA_SERVERS}", "--create", "--if-not-exists", "--topic", "${KAFKA_TOPIC:?set KAFKA_TOPIC}", "--partitions", "${KAFKA_TOPIC_PARTITIONS:?set KAFKA_TOPIC_PARTITIONS}", "--replication-factor", "${KAFKA_TOPIC_REPLICATION_FACTOR:?set KAFKA_TOPIC_REPLICATION_FACTOR}"]
  migrate:
    <<: *app
    build:
      context: ../..
      target: runtime
    restart: "no"
    command: migrate
    depends_on:
      postgres:
        condition: service_healthy
  api:
    <<: *app
    command: api
    ports:
      - ${API_BIND:?set API_BIND}:${API_PORT:?set API_PORT}
  ingestor:
    <<: *app
    command: ingest
  processor:
    <<: *app
    command: process
  references:
    <<: *app
    command: references
    depends_on:
      migrate:
        condition: service_completed_successfully
      objects:
        condition: service_started
  objects:
    image: ${OBJECT_STORE_IMAGE:?set OBJECT_STORE_IMAGE}
    command: mini -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
    volumes:
      - objects:/data
    restart: unless-stopped


volumes:
  postgres:
  kafka:
  objects:
