receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_COLLECTOR_SPIKE_MIB}
  batch:
    timeout: ${env:OTEL_COLLECTOR_BATCH_TIMEOUT}
    send_batch_size: ${env:OTEL_COLLECTOR_BATCH_SIZE}
exporters:
  debug:
    verbosity: detailed
service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
