receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  hostmetrics:
    collection_interval: ${env:OTEL_HOST_METRICS_INTERVAL}
    root_path: /hostfs
    scrapers:
      filesystem:
        include_mount_points:
          mount_points: [/]
          match_type: strict
        metrics:
          system.filesystem.usage:
            enabled: false
          system.filesystem.inodes.usage:
            enabled: false
          system.filesystem.utilization:
            enabled: true
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_COLLECTOR_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_COLLECTOR_SPIKE_MIB}
  resource:
    attributes:
      - key: Project
        value: ${env:OTEL_PROJECT_NAME}
        action: upsert
  filter/free-disk:
    error_mode: ignore
    metrics:
      datapoint:
        - 'metric.name == "system.filesystem.utilization" and attributes["state"] != "free"'
  batch:
    timeout: ${env:OTEL_COLLECTOR_BATCH_TIMEOUT}
    send_batch_size: ${env:OTEL_COLLECTOR_BATCH_SIZE}
exporters:
  awsxray:
    region: ${env:AWS_DEFAULT_REGION}
    local_mode: true
    aws_log_groups: ["${env:CLOUDWATCH_LOG_GROUP}"]
  awscloudwatchlogs:
    region: ${env:AWS_DEFAULT_REGION}
    log_group_name: ${env:CLOUDWATCH_LOG_GROUP}
    log_stream_name: application
    raw_log: false
  awsemf:
    region: ${env:AWS_DEFAULT_REGION}
    namespace: ${env:CLOUDWATCH_METRIC_NAMESPACE}
    log_group_name: ${env:CLOUDWATCH_METRICS_LOG_GROUP}
    log_stream_name: metrics
    dimension_rollup_option: NoDimensionRollup
    resource_to_telemetry_conversion:
      included: [Project, service.name]
    metric_declarations:
      - dimensions: [[Project, service.name]]
        metric_name_selectors: ['^maritime\.']
      - dimensions: [[Project]]
        metric_name_selectors: ['^BackupAgeHours$', '^system\.filesystem\.utilization$']
service:
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awsxray]
    metrics:
      receivers: [otlp, hostmetrics]
      processors: [memory_limiter, resource, filter/free-disk, batch]
      exporters: [awsemf]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [awscloudwatchlogs]
